<body>

    <div class="container">
    <header>
        <h1>Lost & Found</h1>
        <p> Selamat datang di halaman Lost & Found!</p>
    </header>
    <section class="form">
        <h2>Formulir Pelaporan Barang Hilang</h2>
        <form id="formfound" action="tempo.php" method="post">
            <div class="form-group">
                <label for="namabarang">Nama Barang:</label>
                <input type="text" id="namabarang" required placeholder="Contoh: Dompet, RTX 3050.">
            </div>
            <div class="form-group">
                <label for="deskripsibarang">Deskripsi Barang:</label>
                <textarea id="deskripsibarang" required placeholder="Contoh: Colorful iGame GeForce RTX 3050 Ultra White 8GB GDDR6 RAM."></textarea>
            </div>
            <div class="form-group">
                <label for="lokasifound">Lokasi Barang Ditemukan:</label>
                <input type="text" id="lokasifound" required placeholder="Contoh: Gedung Umbrella, Lantai 1, Ruang 101">
            </div>
            <div class="form-group">
                <label for="tanggalfound">Tanggal Barang Ditemukan:</label>
                <input type="date" id="tanggalfound" required>
            </div>
            <div class="form-group">
                <label for="nomorpelapor">Nomor Pelapor:</label>
                <input type="text" id="nomorpelapor" required placeholder="Contoh: 081234567890">
            </div>
            <button type="submit" class="btn">Kirim laporan</button>
        </form>
    </section>
    <section class="found-items">
        <h2>Daftar Barang Ditemukan</h2>
        <div id="itemlist" class="item-list">
            <!-- Daftar barang ditemukan akan ditampilkan di sini -->
        </div>
    </section>
    </div>
